[package]
name = "porechop_abi_native"
description = "Native replacements for Porechop_ABI's former C++ components (from porechop_rs)"
license = "GPL-3.0-or-later"
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
rayon = "1.12.0"

[profile.release]
lto = "fat"
codegen-units = 1
